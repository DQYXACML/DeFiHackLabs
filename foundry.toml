[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
fs_permissions = [{ access = "read", path = "./" }]
evm_version = 'shanghai'
# via_ir = false  # 默认不启用，避免 Yul 栈深度问题
optimizer = true                 # 启用优化器
optimizer_runs = 200             # 优化运行次数
extra_output = ["storageLayout"] # 为Slither生成额外输出
build_info = true                # 生成build-info

# Profile for contracts with Solidity "stack too deep" issues
# Usage: FOUNDRY_PROFILE=via-ir forge build --contracts src/test/XXX.sol
[profile.via-ir]
src = 'src'
out = 'out'
libs = ['lib']
fs_permissions = [{ access = "read", path = "./" }]
evm_version = 'shanghai'
via_ir = true                                       # 启用 via-IR 解决 Solidity stack too deep
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
blast = "${BLAST_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
fantom = "${FANTOM_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
bsc = "${BSC_RPC_URL}"
moonriver = "${MOONRIVER_RPC_URL}"
gnosis = "${GNOSIS_RPC_URL}"
avalanche = "${AVALANCHE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
celo = "${CELO_RPC_URL}"
base = "${BASE_RPC_URL}"
linea = "${LINEA_RPC_URL}"
mantle = "${MANTLE_RPC_URL}"
sei = "${SEI_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/tree/master/.config

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
func_attrs_with_params_multiline = false
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first"
single_line_statement_blocks = 'preserve'
variable_override_spacing = true
wrap_comments = false
ignore = []
